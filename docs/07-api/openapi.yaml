openapi: 3.0.0
info:
  title: Build Market API
  version: 1.0.0
  description: >
    API для автоматизации процесса «Оформление заказа» (компания оптовой торговли стройматериалами).
    Роли и авторизация — см. раздел ниже.

# --------------------------------------------------------------------------
# Авторизация (недостающая часть, добавлена при сборке портфолио).
# Схема сознательно простая — Bearer JWT, без детализации до уровня OAuth-флоу,
# т.к. это не было предметом обсуждения с заказчиком. Роли соответствуют
# участникам to-be процесса: Менеджер, Кладовщик, Руководитель.
# --------------------------------------------------------------------------
security:
  - bearerAuth: []

paths:
  /products:
    get:
      summary: Получить список товаров
      security: [{ bearerAuth: [manager, warehouse, manager_head] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/MinPrice'
        - $ref: '#/components/parameters/MaxPrice'
      responses:
        '200':
          description: Список товаров успешно получен
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Создать товар
      security: [{ bearerAuth: [manager_head] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '201':
          description: Товар добавлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /products/{productId}:
    get:
      summary: Получить товар по ID
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Товар успешно получен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          description: Ресурс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      summary: Частично обновить товар (например, остаток после инвентаризации)
      security: [{ bearerAuth: [warehouse, manager_head] }]
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      responses:
        '200':
          description: Товар частично обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'

  /clients:
    get:
      summary: Получить список клиентов
      parameters:
        - name: name
          in: query
          description: Поиск по имени клиента
          schema:
            type: string
      responses:
        '200':
          description: Список клиентов получен
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientResponse'

    post:
      summary: Создать клиента
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRequest'
      responses:
        '201':
          description: Клиент успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Клиент с таким телефоном уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /clients/{clientId}:
    get:
      summary: Получить клиента по ID
      parameters:
        - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: Клиент успешно получен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '404':
          description: Ресурс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      summary: Частично обновить клиента
      parameters:
        - $ref: '#/components/parameters/ClientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientUpdate'
      responses:
        '200':
          description: Клиент частично обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'

  /orders:
    get:
      summary: Получить список заказов
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Список заказов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'

    post:
      summary: Создать заказ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '201':
          description: Заказ создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'

  /orders/{orderId}:
    get:
      summary: Получить заказ
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Заказ найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          description: Ресурс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      summary: Частичное обновление заказа (поля, не затрагивающие статус)
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdate'
      responses:
        '200':
          description: Заказ частично изменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'

  # Смена статуса вынесена в отдельные action-эндпоинты — переходы должны
  # быть явными и защищёнными бизнес-правилами, а не свободным полем в PATCH.
  /orders/{orderId}/cancel:
    post:
      summary: Отменить заказ
      security: [{ bearerAuth: [manager, manager_head] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cancel_reason]
              properties:
                cancel_reason:
                  type: string
      responses:
        '200':
          description: Заказ отменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '409':
          description: Заказ уже отправлен — отмена невозможна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /orders/{orderId}/confirm:
    post:
      summary: Подтвердить заказ (менеджер фиксирует согласие клиента)
      security: [{ bearerAuth: [manager] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Заказ подтверждён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '409':
          description: Заказ не в статусе «Новый» — подтверждение невозможно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /orders/{orderId}/ship:
    post:
      summary: Отметить заказ как переданный в транспортную компанию
      security: [{ bearerAuth: [warehouse] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Заказ отправлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '409':
          description: Заказ не в статусе «В сборке» — отправка невозможна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Роли передаются в теле токена (claim `role`): manager | warehouse | manager_head.
        Проверка роли на уровне эндпоинта — см. пометки security у операций.

  schemas:
    ClientRequest:
      type: object
      required: [name, surname, phone]
      properties:
        name: { type: string }
        surname: { type: string }
        phone: { type: string }

    ClientResponse:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        name: { type: string }
        surname: { type: string }
        phone: { type: string }
        manager_id: { type: integer, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }

    ClientUpdate:
      type: object
      properties:
        name: { type: string }
        surname: { type: string }
        phone: { type: string, minLength: 12, maxLength: 13 }

    ProductRequest:
      type: object
      required: [name, quantity, price_for_one]
      properties:
        name: { type: string }
        quantity: { type: integer }
        price_for_one: { type: number }

    ProductResponse:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        name: { type: string }
        quantity: { type: integer }
        last_refill: { type: string, format: date-time, readOnly: true }
        price_for_one: { type: number }

    ProductUpdate:
      type: object
      properties:
        name: { type: string }
        quantity: { type: integer }
        price_for_one: { type: number }

    ProductOrder:
      type: object
      required: [product_id, order_quantity]
      properties:
        product_id: { type: integer }
        order_quantity: { type: integer }
        price_for_product: { type: number }

    OrderRequest:
      type: object
      required: [client_id, product_order]
      properties:
        client_id: { type: integer }
        product_order:
          type: array
          items:
            $ref: '#/components/schemas/ProductOrder'

    OrderResponse:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
        client_id: { type: integer }
        status:
          type: string
          readOnly: true
          enum: [Новый, Подтверждён, В сборке, Отправлен, Отменён]
        amount: { type: number, readOnly: true }
        cancel_reason: { type: string, nullable: true }

    OrderUpdate:
      type: object
      properties:
        client_id: { type: integer }

    Error:
      type: object
      properties:
        error: { type: string, example: invalid_request }
        message: { type: string, example: "Некорректный запрос" }

  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      description: Идентификатор товара
      schema: { type: integer }

    OrderId:
      name: orderId
      in: path
      required: true
      description: Идентификатор заказа
      schema: { type: integer }

    ClientId:
      name: clientId
      in: path
      required: true
      description: Идентификатор клиента
      schema: { type: integer }

    Page:
      name: page
      in: query
      description: Номер страницы
      schema: { type: integer, default: 1 }

    Limit:
      name: limit
      in: query
      description: Количество элементов на странице
      schema: { type: integer, default: 20 }

    Sort:
      name: sort
      in: query
      description: Поле для сортировки
      schema:
        type: string
        enum: [name, quantity, price_for_one]

    MaxPrice:
      name: max_price
      in: query
      description: Максимальная цена
      schema: { type: number }

    MinPrice:
      name: min_price
      in: query
      description: Минимальная цена
      schema: { type: number }
